name: Sync Fork Upstream
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5  # 升级v5，消除Node20警告
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config --global user.name "Sync Bot"
          git config --global user.email "sync-bot@github.com"

      - name: Sync upstream repository
        run: |
          # ==================== 修改这里！！====================
          UPSTREAM_REPO="CookSleep/gpt_image_playground"
          TARGET_BRANCH="main" # 如果源码分支是master，改成 master
          # =====================================================
          
          git remote remove upstream || true
          git remote add upstream https://github.com/${UPSTREAM_REPO}.git
          git fetch upstream
          
          # 切换分支
          git checkout ${TARGET_BRANCH}
          
          # 优先策略：合并；冲突则放弃本地改动，完全跟随上游（避免卡死128）
          if git merge upstream/${TARGET_BRANCH}; then
            echo "Merge success"
          else
            echo "Merge conflict, force reset to upstream"
            git reset --hard upstream/${TARGET_BRANCH}
          fi

          # 推送回自己fork仓库，触发Vercel部署
          git push origin ${TARGET_BRANCH} --force-with-lease
